<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini HTML PPT 生成提示词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #FFF5F0; }
  .slideshow { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }
  .slide { position: absolute; inset: 0; display: none; padding: 0; background: #FFF5F0; }
  .slide.active { display: block; }
  .slide-inner { width: 100%; height: 100%; max-width: 1600px; max-height: 900px; margin: 0 auto; position: relative; background: #FFF5F0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 70px; }
  h1 { font-size: 48px; font-weight: 700; color: #D32F2F; line-height: 1.2; letter-spacing: 2px; text-align: center; }
  h2 { font-size: 36px; font-weight: 700; color: #D32F2F; line-height: 1.3; letter-spacing: 1px; text-align: center; margin-bottom: 8px; }
  h3 { font-size: 22px; font-weight: 600; color: #5D4037; line-height: 1.4; }
  p, li { font-size: 16px; line-height: 1.7; color: #5D4037; }
  .subtitle { font-size: 20px; color: #8D6E63; text-align: center; margin-top: 10px; }
  .card { background: #fff; border-radius: 20px; padding: 24px 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 2px solid transparent; }
  .card-pink { background: #FFEBEE; border-color: #FFCDD2; }
  .card-green { background: #E8F5E9; border-color: #C8E6C9; }
  .card-yellow { background: #FFF8E1; border-color: #FFECB3; }
  .card-orange { background: #FFF3E0; border-color: #FFE0B2; }
  .flex-row { display: flex; gap: 20px; width: 100%; justify-content: center; align-items: stretch; }
  .col-2 { flex: 1; max-width: 480px; }
  .col-3 { flex: 1; max-width: 320px; }
  .page-num { position: absolute; bottom: 24px; right: 36px; font-size: 14px; color: #BCAAA4; font-weight: 500; }
  .tag { display: inline-block; background: #D32F2F; color: #fff; padding: 6px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-right: 6px; }
  .badge-green { background: #E8F5E9; color: #2E7D32; }
  .badge-red { background: #FFEBEE; color: #C62828; }
  .badge-orange { background: #FFF3E0; color: #EF6C00; }
  .badge-gray { background: #F5F5F5; color: #616161; }
  .code-block { background: #263238; color: #aed581; border-radius: 12px; padding: 16px 20px; font-family: "SF Mono", Monaco, monospace; font-size: 13px; line-height: 1.6; overflow-x: auto; }
  .code-block .comment { color: #78909c; }
  .code-block .tag { background: transparent; color: #ff7043; padding: 0; font-weight: 600; }
  .code-block .attr { color: #82b1ff; }
  .highlight { background: #FFEBEE; padding: 2px 6px; border-radius: 4px; color: #C62828; font-weight: 600; }
  .tip-box { background: #E8F5E9; border: 2px solid #C8E6C9; border-radius: 16px; padding: 16px 20px; }
  .warn-box { background: #FFEBEE; border: 2px solid #FFCDD2; border-radius: 16px; padding: 16px 20px; }
  ul.dense li { padding: 4px 0; }
</style>
</head>
<body>
<div class="slideshow" id="slideshow">
